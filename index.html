<!doctype html>
<html lang="fr" data-lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JGC Studio · Sabine F. Cissé</title>
<meta name="description" content="Le cabinet de création de Sabine F. Cissé : un bureau Dark Academia à parcourir objet par objet.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --cream: #EBE4D6; --cream-dim: rgba(235,228,214,.84); --gold: #A87230; --gold-soft: #c99a4b; --ink: #1C1915; --teal: #2E5C5A; --scrim: 12,11,9; --card-paper: #15110c; --card-ink: #d9ccb4;
  --display: "Playfair Display", Georgia, serif; --text: "EB Garamond", Georgia, serif; --mono: "Courier Prime", "Courier New", monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #0b0a08; color: var(--cream); font-family: var(--text); font-size: 18px; }
a { color: var(--gold-soft); }
button { font: inherit; color: inherit; }

/* Barre du haut */
.top { position: fixed; inset: 0 0 auto 0; z-index: 20; display: flex; align-items: center; gap: 1.2rem; padding: .9rem 1.4rem;
  background: linear-gradient(rgba(var(--scrim),.85), rgba(var(--scrim),0)); font-family: var(--mono); font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; }
.top .brand { font-family: var(--display); font-size: 1.05rem; letter-spacing: .08em; text-transform: none; color: var(--cream); text-decoration: none; margin-right: auto; }
.top a, .top button { color: var(--cream); background: none; border: 1px solid transparent; padding: .35rem .55rem; cursor: pointer; text-decoration: none; }
.top .on { border-color: var(--gold); color: var(--gold-soft); }
.top .links a { padding: .35rem .4rem; }

/* Scène fixe */
.track { position: relative; }
.stage { position: fixed; inset: 0; overflow: hidden; background: #0b0a08; }
.stage img, .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
.stage .show { opacity: 1; }
.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 90% 80% at 50% 45%, transparent 55%, rgba(var(--scrim),.7) 100%); }

/* Panneaux de texte */
.panel { position: fixed; z-index: 10; top: 50%; transform: translateY(-46%); width: min(31rem, 38vw); opacity: 0; pointer-events: none; transition: opacity .25s linear;
  text-shadow: 0 1px 14px rgba(var(--scrim),.95), 0 0 2px rgba(var(--scrim),.9); }
.panel.visible { pointer-events: auto; }
.panel::before { content: ""; position: absolute; inset: -2.4rem -2.8rem; z-index: -1; filter: blur(12px); pointer-events: none;
  background: radial-gradient(closest-side, rgba(var(--scrim),.84), rgba(var(--scrim),.6) 62%, rgba(var(--scrim),0)); }
.panel.left { left: 6vw; } .panel.right { right: 7vw; }
.panel.bottom { left: 50%; top: auto; bottom: 19vh; transform: translateX(-50%); width: min(40rem, 80vw); text-align: center; }
.kicker { font-family: var(--mono); font-weight: 700; font-size: .74rem; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-soft); margin: 0 0 .7rem; display: flex; align-items: center; gap: .75rem; }
.panel.bottom .kicker { justify-content: center; }
/* Sceau rond façon Memento Mori autour du numéro de l'objet */
.seal { display: inline-block; width: 3.4rem; height: 3.4rem; color: var(--gold-soft); flex: none; }
.seal svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 6px rgba(var(--scrim),.9)); }
.seal .s-line { fill: none; stroke: currentColor; }
.seal .s-fill { fill: currentColor; }
.seal ellipse, .seal path { stroke-width: 1; }
.seal .s-num { font-family: var(--display); font-weight: 500; fill: currentColor; text-anchor: middle; dominant-baseline: central; letter-spacing: 0; font-variant-numeric: lining-nums; }
.panel h2, .panel h1 { font-family: var(--display); font-weight: 400; line-height: 1.12; margin: 0 0 .8rem; color: var(--cream); }
.panel h1 { font-size: clamp(2.2rem, 4.6vw, 3.8rem); }
.panel h2 { font-size: clamp(1.6rem, 2.6vw, 2.3rem); }
.panel p { margin: 0 0 .9rem; font-size: 1.1rem; line-height: 1.55; color: var(--cream-dim); }
.more { font-family: var(--mono); font-size: .76rem; letter-spacing: .14em; text-transform: uppercase; color: var(--cream); background: rgba(var(--scrim),.5);
  border: 1px solid var(--gold); padding: .6rem 1rem; cursor: pointer; }
.more:hover { background: var(--gold); color: var(--ink); }
.hint { font-family: var(--mono); font-size: .76rem; letter-spacing: .16em; text-transform: uppercase; color: var(--cream); margin-top: 1rem; }

/* Cartes de tarot gravées : une par arrêt, la carte en cours passe à l'or */
.chapnav { position: fixed; z-index: 15; right: calc(env(safe-area-inset-right, 0px) + 1.1rem); top: 50%; transform: translateY(-50%); display: grid; gap: min(.45rem, .9vh); justify-items: end; }
.chapnav button { display: flex; align-items: center; gap: .7rem; padding: 0; background: none; border: 0; cursor: pointer; }
.card { --cb: var(--card-paper); --cl: var(--card-ink); display: block; height: min(3.1rem, 8.4vh); width: auto; aspect-ratio: 60 / 96; overflow: visible; transition: transform .35s ease, filter .35s ease; filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); }
.card .c-bg { fill: var(--cb); stroke: var(--cl); stroke-width: 1.6; transition: fill .35s; }
.card .c-in { fill: none; stroke: var(--cl); stroke-width: .7; opacity: .85; }
.card .c-icon { fill: none; stroke: var(--cl); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.card .c-dot { fill: var(--cl); }
.card .c-num { font-family: var(--display); font-weight: 500; font-size: 11px; font-variant-numeric: lining-nums; fill: var(--cl); text-anchor: middle; }
.chapnav button:hover .card, .chapnav button:focus-visible .card { transform: translateX(-3px) rotate(-2deg); }
.chapnav .lbl { font-family: var(--mono); font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--cream); opacity: 0; transform: translateX(6px); transition: opacity .25s, transform .25s; white-space: nowrap; text-shadow: 0 1px 8px rgba(var(--scrim),1); }
.chapnav button:hover .lbl, .chapnav button:focus-visible .lbl { opacity: 1; transform: none; }
.chapnav button[aria-current="true"] .card { --cb: var(--gold); --cl: var(--ink); transform: translateX(-6px) scale(1.1); filter: drop-shadow(0 0 12px rgba(201,154,75,.55)); }
.top .br { display: none; }
.snap { position: absolute; left: 0; width: 1px; height: 1px; scroll-snap-align: start; scroll-snap-stop: always; pointer-events: none; }
html.snapping { scroll-snap-type: y mandatory; }
#vh-probe { position: absolute; top: 0; left: -10px; width: 1px; height: 100vh; height: 100lvh; visibility: hidden; pointer-events: none; }
.teaser { font-style: italic; color: var(--cream) !important; }
.teaser em { font-style: normal; }
.bar { position: fixed; left: 0; top: 0; height: 2px; background: var(--gold); z-index: 25; width: 0; }

/* Fenêtre de lecture */
dialog { width: min(42rem, 92vw); max-height: 86vh; border: 1px solid var(--gold); background: #17140f; color: var(--cream); padding: 2.2rem 2.4rem; }
dialog::backdrop { background: rgba(0,0,0,.72); }
dialog h2 { font-family: var(--display); font-weight: 400; font-size: 2rem; margin: 0 0 1rem; color: var(--gold-soft); }
dialog p, dialog li { font-size: 1.08rem; line-height: 1.6; color: var(--cream-dim); }
dialog ul { padding-left: 1.2rem; }
dialog strong { color: var(--cream); font-weight: 500; }
dialog .close { position: absolute; top: .8rem; right: 1rem; background: none; border: 0; color: var(--gold-soft); font-size: 1.8rem; cursor: pointer; }
.timeline-entry { border-left: 2px solid var(--gold); padding-left: 1rem; margin: 0 0 1rem; }
.timeline-date { font-family: var(--mono); font-size: .8rem; letter-spacing: .1em; color: var(--gold-soft); }
.link-row { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1rem 0; }
.link-btn { border: 1px solid var(--gold); padding: .45rem .9rem; text-decoration: none; color: var(--cream); font-family: var(--mono); font-size: .8rem; letter-spacing: .08em; }
.modal-accent { color: var(--gold-soft) !important; font-style: italic; }

/* Formulaire de contact (lampe) */
.contact { margin-top: 1.8rem; padding-top: 1.4rem; border-top: 1px solid rgba(168,114,48,.45); }
.contact h3 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; color: var(--cream); margin: 0 0 1rem; }
.contact label { display: block; font-family: var(--mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-soft); margin: 0 0 .35rem; }
.contact .field { margin-bottom: 1rem; }
.contact input, .contact textarea { width: 100%; font: inherit; font-size: 1.05rem; color: var(--cream); background: rgba(12,11,9,.6); border: 1px solid rgba(168,114,48,.6); border-radius: 0; padding: .65rem .8rem; }
.contact textarea { min-height: 8.5rem; resize: vertical; line-height: 1.5; }
.contact input::placeholder, .contact textarea::placeholder { color: rgba(235,228,214,.45); font-style: italic; }
.contact input:focus, .contact textarea:focus { outline: none; border-color: var(--gold-soft); box-shadow: 0 0 0 2px rgba(201,154,75,.25); }
.contact .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.contact .send { margin-top: .2rem; }
.contact .send[disabled] { opacity: .6; cursor: wait; }
.contact .note { font-size: .95rem; font-style: italic; margin: .8rem 0 0; }
.contact .status { margin: .8rem 0 0; }
.contact .status.err { color: #e0a58a !important; }
.contact .done { text-align: center; padding: 1rem 0; }
.contact .done p { margin: .3rem 0; }
.panel .row { display: flex; flex-wrap: wrap; gap: .6rem; }

/* Lecture sans animation */
.reader { display: none; max-width: 46rem; margin: 0 auto; padding: 6rem 1.4rem 4rem; }
.reader section { margin-bottom: 3.5rem; }
.reader img { width: 100%; display: block; margin-bottom: 1.2rem; border: 1px solid rgba(168,114,48,.4); }
.reader h2 { font-family: var(--display); font-weight: 400; font-size: 2rem; color: var(--gold-soft); margin: 0 0 .8rem; }
.reader p, .reader li { line-height: 1.6; color: var(--cream-dim); }
body.static .reader { display: block; }
body.static .track, body.static .stage, body.static .panel, body.static .chapnav, body.static .bar { display: none; }

/* Musique */
.music { position: fixed; left: 1.2rem; bottom: 1.1rem; z-index: 20; font-family: var(--mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase;
  background: rgba(var(--scrim),.7); border: 1px solid rgba(168,114,48,.6); color: var(--cream); padding: .5rem .8rem; cursor: pointer; }

/* Téléphone */
@media (max-width: 760px), (max-aspect-ratio: 4/5) {
  html, body { font-size: 16px; }
  .top { padding: .7rem .9rem; gap: .5rem; font-size: .68rem; }
  .top { flex-wrap: wrap; row-gap: .15rem; padding-bottom: 1.4rem; }
  .top .brand { order: 0; } #lang-fr, #lang-en { order: 1; }
  .top .br { display: block; order: 2; flex-basis: 100%; height: 0; }
  .top .links { order: 3; margin-right: auto; } .top .links a { padding: .35rem .5rem .35rem 0; margin-right: .5rem; }
  #static-btn { order: 4; }
  .panel, .panel.left, .panel.right, .panel.bottom { left: 1.1rem; right: 2.9rem; width: auto; top: auto; bottom: 4.2rem; transform: none; text-align: left; }
  .panel::before { inset: -1.6rem -1.1rem -4.2rem; background: linear-gradient(rgba(var(--scrim),0), rgba(var(--scrim),.82) 30%, rgba(var(--scrim),.92)); filter: none; }
  .panel h1 { font-size: 2.1rem; } .panel h2 { font-size: 1.6rem; }
  .seal { width: 2.7rem; height: 2.7rem; } .kicker { gap: .6rem; margin-bottom: .5rem; }
  .panel p { font-size: 1.02rem; }
  .chapnav { right: calc(env(safe-area-inset-right, 0px) + .45rem); gap: .3rem; top: 42%; }
  .card { height: min(2.4rem, 5.6vh); }
  .chapnav .lbl { display: none; }
  .music { left: auto; right: .9rem; bottom: .8rem; }
}
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<header class="top">
  <a class="brand" href="#" id="brand">JGC Studio</a>
  <span class="links"><a href="https://journalistgeocultures.com/" target="_blank" rel="noopener" data-t="blog"></a><a href="https://sabinefcisse.com/" target="_blank" rel="noopener" data-t="portfolio"></a></span>
  <span class="br"></span><button id="lang-fr">FR</button><button id="lang-en">EN</button>
  <button id="static-btn" data-t="static"></button>
</header>

<div class="stage" id="stage"><div class="vignette"></div></div>
<div class="track" id="track"></div><div id="vh-probe"></div>
<div id="panels"></div>
<nav class="chapnav" id="dots" aria-label="Objets"></nav>
<main class="reader" id="reader"></main>
<button class="music" id="music" type="button" data-t="music"></button>
<audio id="bgm" loop preload="none" src="https://journalistgeocultures.wordpress.com/wp-content/uploads/2026/04/rhian-sheehan-la-boite-a-musique-eclise-remix.mp3"></audio>

<dialog id="dlg"><button class="close" id="dlg-close" aria-label="Fermer">×</button><div id="dlg-body"></div></dialog>

<script>
(async () => {
  const UI = {
    fr: { form_title: "Commençons l'échange", form_name: "Votre nom", form_name_ph: "Prénom Nom", form_email: "Votre e-mail", form_email_ph: "votre@email.com", form_msg: "Votre message", form_msg_ph: "Parlez-moi de votre projet, de vos ambitions, de ce qui vous anime…", form_send: "Envoyer le message", form_sending: "Envoi en cours…", form_retry: "Réessayer", form_note: "Réponse sous 48 heures.", form_ok: "Message envoyé.", form_ok2: "Merci pour votre message : je vous réponds sous 48 heures.", form_err: "L'envoi n'a pas abouti. Réessayez, ou écrivez-moi à contact@journalistgeocultures.com.", write: "Écrire un message",
      blog: "Le Blog", portfolio: "Portfolio", static: "Lire sans animation", static_on: "Voyage immersif", more: "Lire la suite", hint: "Faites défiler pour entrer", music: "Musique", music_on: "Pause", sub: "Le cabinet de création de Sabine F. Cissé", objects: "Objets" },
    en: { form_title: "Let's start the conversation", form_name: "Your name", form_name_ph: "First Last", form_email: "Your email", form_email_ph: "you@example.com", form_msg: "Your message", form_msg_ph: "Tell me about your project, your ambitions, what drives you…", form_send: "Send message", form_sending: "Sending…", form_retry: "Try again", form_note: "Reply within 48 hours.", form_ok: "Message sent.", form_ok2: "Thank you for your message: I will reply within 48 hours.", form_err: "The message could not be sent. Please try again, or write to contact@journalistgeocultures.com.", write: "Write a message",
      blog: "The Blog", portfolio: "Portfolio", static: "Read without animation", static_on: "Immersive journey", more: "Read more", hint: "Scroll to enter", music: "Music", music_on: "Pause", sub: "Sabine F. Cissé's creative study", objects: "Objects" }
  };
  // Arrêts : ouverture puis les huit objets, dans l'ordre de la caméra. side = côté du texte sur ordinateur.
  const STOPS = [
    { key: "_welcome", side: "bottom", label: { fr: "0 · L'ouverture", en: "0 · The opening" } },
    { key: "book", side: "right", label: { fr: "I · La bibliothèque", en: "I · The library" } },
    { key: "typewriter", side: "left", label: { fr: "II · La machine à écrire", en: "II · The typewriter" } },
    { key: "parchemins", side: "right", label: { fr: "III · Les parchemins", en: "III · The scrolls" } },
    { key: "frame", side: "left", label: { fr: "IV · Le cadre", en: "IV · The frame" } },
    { key: "mic", side: "left", label: { fr: "V · Le micro", en: "V · The microphone" } },
    { key: "laptop", side: "left", label: { fr: "VI · L'ordinateur", en: "VI · The computer" } },
    { key: "tea", side: "right", label: { fr: "VII · Le thé", en: "VII · The tea" } },
    { key: "lamp", side: "left", label: { fr: "VIII · La lampe", en: "VIII · The lamp" } }
  ];
  const HOLD = 1.0, CLIP = 1.6;            // hauteur de défilement, en écrans, d'un arrêt et d'un clip
  const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
  // La langue suit l'adresse : index.html en français, index-en.html en anglais (comme l'ancien site)
  let lang = document.documentElement.dataset.lang || (store.get("jgc-lang") === "en" ? "en" : "fr");
  const syncUrl = () => { if (location.protocol.startsWith("http")) { try { history.replaceState(null, "", (lang === "en" ? "index-en.html" : "./") + location.hash); } catch (e) {} } };
  let isStatic = store.get("jgc-static") === "1" || matchMedia("(prefers-reduced-motion: reduce)").matches;
  const C = await (await fetch("content.json")).json();
  const mobile = () => matchMedia("(max-width: 760px), (max-aspect-ratio: 4/5)").matches;
  const sfx = () => mobile() ? "-m" : "";

  const stage = document.getElementById("stage"), panelsBox = document.getElementById("panels"), track = document.getElementById("track");
  const imgs = [], vids = [], panels = [];
  let segs = [], total = 0, U = innerHeight;
  const probe = document.getElementById("vh-probe");
  const snapY = s => s.i === 0 ? 0 : s.start + s.len / 2;

  function leadOf(body) {
    const ps = [...body.matchAll(/<p(?![^>]*class=)[^>]*>(.*?)<\/p>/g)].map(m => m[1]).filter(t => t.replace(/<[^>]+>/g, "").length > 40);
    return ps[0] || "";
  }
  function buildMedia() {
    stage.querySelectorAll("img,video").forEach(n => n.remove()); imgs.length = 0; vids.length = 0;
    const vig = stage.querySelector(".vignette");
    STOPS.forEach((s, i) => {
      const im = new Image(); im.src = `img/s${i}${sfx()}.jpg`; im.alt = ""; im.decoding = "async"; stage.insertBefore(im, vig); imgs.push(im);
      if (i < STOPS.length - 1) {
        const v = document.createElement("video"); v.muted = true; v.playsInline = true; v.setAttribute("playsinline", ""); v.preload = i < 2 ? "auto" : "none";
        v.src = `clips/c${i}${sfx()}.mp4`; stage.insertBefore(v, vig); vids.push(v);
      }
    });
  }
  function buildPanels() {
    panelsBox.innerHTML = ""; panels.length = 0;
    STOPS.forEach((s, i) => {
      const d = document.createElement("div"); d.className = "panel " + s.side;
      if (i === 0) {
        const w = C[lang]._welcome;
        d.innerHTML = `<p class="kicker">${UI[lang].sub}</p><h1>JGC Studio</h1><p>${w[0]}</p><p>${w[1]}</p><p class="hint">${UI[lang].hint}</p>`;
      } else {
        const it = C[lang][s.key];
        const name = s.label[lang].replace(/^[0IVX]+ · /, "");
        d.innerHTML = `<p class="kicker"><span class="seal">${seal(ROMAN[i])}</span><span>${name}</span></p><h2>${it.title}</h2><p>${leadOf(it.body)}</p>${it.teaser ? `<p class="teaser">${it.teaser}</p>` : ""}<p class="row"><button class="more" type="button">${UI[lang].more}</button>${s.key === "lamp" ? `<button class="more write" type="button">${UI[lang].write}</button>` : ""}</p>`;
        d.querySelector(".more").onclick = () => openDlg(i);
        if (s.key === "lamp") d.querySelector(".write").onclick = () => openDlg(i, true);
      }
      panelsBox.appendChild(d); panels.push(d);
    });
  }
  function buildReader() {
    const r = document.getElementById("reader"); const w = C[lang]._welcome;
    r.innerHTML = `<section><img src="img/s0${sfx()}.jpg" alt=""><h2>JGC Studio</h2><p>${w[0]}</p><p>${w[1]}</p></section>` +
      STOPS.slice(1).map((s, k) => `<section><img src="img/s${k + 1}${sfx()}.jpg" alt=""><h2>${C[lang][s.key].title}</h2>${C[lang][s.key].body}${s.key === "lamp" ? contactForm("r") : ""}</section>`).join("");
  }
  function buildTrack() {
    segs = []; let y = 0;
    STOPS.forEach((s, i) => {
      segs.push({ type: "stop", i, start: y, len: HOLD }); y += HOLD;
      if (i < STOPS.length - 1) { segs.push({ type: "clip", i, start: y, len: CLIP }); y += CLIP; }
    });
    total = y; U = probe.offsetHeight || innerHeight;
    track.style.height = (total + 1) * U + "px";
    // Points d'aimantation : le début de l'ouverture, puis le milieu de chaque arrêt (le texte y est pleinement visible)
    track.querySelectorAll(".snap").forEach(n => n.remove());
    segs.filter(s => s.type === "stop").forEach(s => { const n = document.createElement("div"); n.className = "snap"; n.style.top = snapY(s) * U + "px"; track.appendChild(n); });
    document.documentElement.classList.toggle("snapping", mobile() && !isStatic);
    const dots = document.getElementById("dots"); dots.innerHTML = "";
    STOPS.forEach((s, i) => { const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", s.label[lang]); b.innerHTML = `<span class="lbl">${s.label[lang]}</span>${tarot(i)}`; b.onclick = () => goTo(i); dots.appendChild(b); });
  }
  // Cartes de tarot : lune et étoiles gravées, chiffre romain (0 pour l'ouverture, comme le Mat), emblème de l'objet
  const ROMAN = ["0", "I", "II", "III", "IV", "V", "VI", "VII", "VIII"];
  const ICONS = [
    '<path d="M20 76V54a10 10 0 0 1 20 0v22z"/><path d="M30 44v32M20 61h20M20 68.5h20"/><path d="M16 76h28"/>',
    '<rect x="17" y="52" width="6" height="22" rx=".8"/><rect x="24" y="48" width="6" height="26" rx=".8"/><rect x="31" y="54" width="5" height="20" rx=".8"/><path d="M37.5 74l4.6-19 4.8 1.2-4.6 18.8"/><path d="M17 57h6M24 53h6M24 69h6M14 74.5h34"/>',
    '<path d="M23 60V48h14v12"/><path d="M26 52h8M26 55h6"/><rect x="18" y="59" width="24" height="3.4" rx="1.7"/><path d="M17 75l3-12.6h20l3 12.6z"/><path d="M22.5 68.5h1.5M26.5 68.5h1.5M30.5 68.5h1.5M34.5 68.5h1.5M24.5 72h11"/>',
    '<path d="M21 51h18a3 3 0 0 1 0 6H21a3 3 0 0 1 0-6z"/><path d="M22.5 57v13.5M37.5 57v13.5"/><path d="M21 70.5h18a3 3 0 0 1 0 6H21a3 3 0 0 1 0-6z"/><path d="M26 61.5h8M26 65.5h6"/><path d="M30 51v-3.5M27 45.5l3 2 3-2"/>',
    '<ellipse cx="30" cy="61" rx="11" ry="14"/><ellipse cx="30" cy="61" rx="8" ry="11"/><circle cx="30" cy="58" r="3"/><path d="M24.8 68.6a5.2 4.6 0 0 1 10.4 0"/><path d="M27 45.5l3-2.8 3 2.8"/>',
    '<rect x="25" y="44" width="10" height="17" rx="5"/><path d="M25 49.5h10M25 53.5h10M25 57.5h10"/><path d="M21.5 54a8.5 8.5 0 0 0 17 0"/><path d="M30 62.5v10M23 75h14"/>',
    '<rect x="18.5" y="49" width="23" height="16.5" rx="1.2"/><rect x="21.5" y="52" width="17" height="10.5"/><path d="M14 68h32l2.5 5h-37z"/><path d="M27 70.5h6"/>',
    '<path d="M18.5 61h18v3.5a9 9 0 0 1-18 0z"/><path d="M36.5 62.5a3.6 3.6 0 0 1 0 7.2h-1"/><path d="M14 75.5c5 2.4 23 2.4 28 0"/><path d="M24.5 57c-2.2-3 2.2-5 0-8.2M30.5 57c-2.2-3 2.2-5 0-8.2"/>',
    '<path d="M23 45h14l5.5 13h-25z"/><path d="M27 45l-2 13M30 45v13M33 45l2 13"/><path d="M30 58v13"/><circle cx="30" cy="63" r="1.6"/><path d="M25.5 71.5h9M23 75h14"/>'
  ];
  // Sceau rond : double anneau, quatre points, deux branches de laurier, le numéro au centre (repris du Manoir)
  const pt = (cx, cy, r, deg) => [cx + r * Math.cos(deg * Math.PI / 180), cy + r * Math.sin(deg * Math.PI / 180)];
  const fx = n => n.toFixed(2);
  function laurel(cx, cy, r, from, to, n, leaf, cls) {
    const [x1, y1] = pt(cx, cy, r, from), [x2, y2] = pt(cx, cy, r, to);
    let out = `<path class="${cls}" d="M${fx(x1)} ${fx(y1)} A${r} ${r} 0 0 ${to > from ? 1 : 0} ${fx(x2)} ${fx(y2)}"/>`;
    for (let k = 0; k < n; k++) {
      const a = from + (to - from) * (k + .5) / n;
      for (const side of [-1, 1]) {
        const [x, y] = pt(cx, cy, r + side * leaf * .55, a);
        const rot = a + 90 + side * (to > from ? 38 : -38);
        out += `<ellipse class="${cls}" cx="${fx(x)}" cy="${fx(y)}" rx="${fx(leaf)}" ry="${fx(leaf * .42)}" transform="rotate(${fx(rot)} ${fx(x)} ${fx(y)})"/>`;
      }
    }
    return out;
  }
  function seal(num) {
    const dots = [0, 90, 180, 270].map(a => { const [x, y] = pt(50, 50, 44, a); return `<circle class="s-fill" cx="${fx(x)}" cy="${fx(y)}" r="1.9"/>`; }).join("");
    const size = num.length > 3 ? 14 : num.length > 2 ? 17 : num.length > 1 ? 20 : 23;
    return `<svg viewBox="0 0 100 100" aria-hidden="true">
      <circle class="s-line" cx="50" cy="50" r="47" stroke-width="1.4"/>
      <circle class="s-line" cx="50" cy="50" r="41" stroke-width=".7"/>
      ${dots}
      ${laurel(50, 50, 35.5, 128, 232, 6, 3.6, "s-line")}
      ${laurel(50, 50, 35.5, 52, -52, 6, 3.6, "s-line")}
      <circle class="s-line" cx="50" cy="50" r="27" stroke-width="1.2"/>
      <circle class="s-line" cx="50" cy="50" r="24" stroke-width=".5"/>
      <text class="s-num" x="50" y="51" font-size="${size}">${num}</text>
    </svg>`;
  }
  function tarot(i) {
    return `<svg class="card" viewBox="0 0 60 96" aria-hidden="true">
      <rect class="c-bg" x="1.5" y="1.5" width="57" height="93" rx="7"/>
      <rect class="c-in" x="5.5" y="5.5" width="49" height="85" rx="4"/>
      <text class="c-num" x="30" y="19">${ROMAN[i]}</text>
      <path class="c-in" d="M10 25h40M10 81h40"/>
      <path class="c-dot" d="M13.5 29.5a4.6 4.6 0 1 0 5.7 6.7 3.8 3.8 0 1 1-5.7-6.7z"/>
      <circle class="c-dot" cx="44" cy="30.5" r=".9"/><circle class="c-dot" cx="48" cy="36" r=".8"/><circle class="c-dot" cx="40" cy="35.5" r=".7"/><circle class="c-dot" cx="11.5" cy="44" r=".7"/><circle class="c-dot" cx="48.5" cy="44" r=".8"/>
      <g class="c-icon">${ICONS[i]}</g>
      <circle class="c-dot" cx="24" cy="86" r=".9"/><circle class="c-dot" cx="30" cy="86" r="1.2"/><circle class="c-dot" cx="36" cy="86" r=".9"/>
    </svg>`;
  }
  function goTo(i) { const sg = segs.find(s => s.type === "stop" && s.i === i); scrollTo({ top: snapY(sg) * U, behavior: "smooth" }); }
  function contactForm(formN) {
    const u = UI[lang];
    return `<section class="contact"><h3>${u.form_title}</h3>
      <form action="https://formspree.io/f/xvzdoklv" method="POST" novalidate>
        <div class="field"><label for="cf-name-${formN}">${u.form_name}</label><input id="cf-name-${formN}" type="text" name="name" required autocomplete="name" placeholder="${u.form_name_ph}"></div>
        <div class="field"><label for="cf-email-${formN}">${u.form_email}</label><input id="cf-email-${formN}" type="email" name="email" required autocomplete="email" placeholder="${u.form_email_ph}"></div>
        <div class="field"><label for="cf-msg-${formN}">${u.form_msg}</label><textarea id="cf-msg-${formN}" name="message" required placeholder="${u.form_msg_ph}"></textarea></div>
        <div class="hp" aria-hidden="true"><input type="text" name="_gotcha" tabindex="-1" autocomplete="off"></div>
        <input type="hidden" name="_language" value="${lang}">
        <button class="more send" type="submit">${u.form_send}</button>
        <p class="note">${u.form_note}</p><p class="status" role="status" aria-live="polite"></p>
      </form></section>`;
  }
  function openDlg(i, toForm) {
    const k = STOPS[i].key, it = C[lang][k];
    document.getElementById("dlg-body").innerHTML = `<h2>${it.title}</h2>${it.body}` + (k === "lamp" ? contactForm("d") : "");
    const dlg = document.getElementById("dlg"); dlg.showModal();
    if (toForm) { const sec = dlg.querySelector(".contact"); sec.scrollIntoView({ block: "start" }); sec.querySelector("input").focus({ preventScroll: true }); }
  }
  // Envoi sans quitter la page (Formspree répond en JSON)
  document.addEventListener("submit", async e => {
    const form = e.target.closest(".contact form"); if (!form) return;
    e.preventDefault();
    const u = UI[lang], btn = form.querySelector(".send"), st = form.querySelector(".status");
    st.textContent = ""; st.classList.remove("err");
    if (!form.checkValidity()) { form.reportValidity(); return; }
    btn.disabled = true; btn.textContent = u.form_sending;
    try {
      const r = await fetch(form.action, { method: "POST", body: new FormData(form), headers: { Accept: "application/json" } });
      if (!r.ok) throw new Error(r.status);
      form.parentElement.innerHTML = `<div class="done"><p class="modal-accent">✦</p><p><strong>${u.form_ok}</strong></p><p>${u.form_ok2}</p></div>`;
    } catch (err) {
      btn.disabled = false; btn.textContent = u.form_retry; st.textContent = u.form_err; st.classList.add("err");
    }
  });
  document.getElementById("dlg-close").onclick = () => document.getElementById("dlg").close();
  document.getElementById("dlg").addEventListener("click", e => { if (e.target.id === "dlg") e.target.close(); });

  function applyText() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach(n => n.textContent = UI[lang][n.dataset.t]);
    document.getElementById("static-btn").textContent = isStatic ? UI[lang].static_on : UI[lang].static;
    document.getElementById("lang-fr").classList.toggle("on", lang === "fr"); document.getElementById("lang-en").classList.toggle("on", lang === "en");
    document.getElementById("music").textContent = bgm.paused ? UI[lang].music : UI[lang].music_on;
    document.body.classList.toggle("static", isStatic);
    buildPanels(); buildReader(); buildTrack();
  }
  const bgm = document.getElementById("bgm");
  document.getElementById("music").onclick = () => { bgm.paused ? bgm.play().catch(() => {}) : bgm.pause(); applyText(); };
  document.getElementById("lang-fr").onclick = () => { lang = "fr"; store.set("jgc-lang", lang); syncUrl(); applyText(); };
  document.getElementById("lang-en").onclick = () => { lang = "en"; store.set("jgc-lang", lang); syncUrl(); applyText(); };
  document.getElementById("static-btn").onclick = () => { isStatic = !isStatic; store.set("jgc-static", isStatic ? "1" : "0"); applyText(); scrollTo(0, 0); };
  document.getElementById("brand").onclick = e => { e.preventDefault(); scrollTo({ top: 0, behavior: "smooth" }); };

  // iPhone : une vidéo n'affiche rien tant qu'elle n'a pas été lancée une fois
  let primed = false;
  function prime() { if (primed) return; primed = true; vids.forEach(v => { const p = v.play(); if (p && p.then) p.then(() => v.pause()).catch(() => {}); }); }
  ["touchstart", "pointerdown", "wheel", "keydown"].forEach(ev => addEventListener(ev, prime, { once: true, passive: true }));

  let shown = 0, lastMobile = mobile();
  function frame() {
    if (mobile() !== lastMobile) { lastMobile = mobile(); buildMedia(); buildReader(); buildTrack(); }
    if (probe.offsetHeight && Math.abs(probe.offsetHeight - U) > 1) { const p = scrollY / U; buildTrack(); scrollTo(0, p * U); }
    if (!isStatic && U > 0) {
      const target = scrollY / U;
      if (!isFinite(shown)) shown = target;
      shown += (target - shown) * 0.2; if (Math.abs(target - shown) < 0.0005) shown = target;
      document.getElementById("bar").style.width = Math.min(100, shown / total * 100) + "%";
      const sg = segs.find(s => shown >= s.start && shown < s.start + s.len) || segs[segs.length - 1];
      const local = Math.min(1, Math.max(0, (shown - sg.start) / sg.len));
      let still = -1, vid = -1;
      if (sg.type === "stop") still = sg.i;
      else {
        const v = vids[sg.i]; vid = sg.i;
        if (v.preload !== "auto") { v.preload = "auto"; v.load(); }
        if (vids[sg.i + 1] && vids[sg.i + 1].preload !== "auto") { vids[sg.i + 1].preload = "auto"; vids[sg.i + 1].load(); }
        if (v.readyState >= 2 && v.duration) { const t = local * (v.duration - 0.05); if (!v.seeking && Math.abs(v.currentTime - t) > 0.02) v.currentTime = t; }
        else { vid = -1; still = local < .5 ? sg.i : sg.i + 1; }
      }
      imgs.forEach((im, k) => im.classList.toggle("show", k === still || (vid >= 0 && (k === vid || k === vid + 1) && false)));
      vids.forEach((v, k) => v.classList.toggle("show", k === vid));
      if (vid >= 0) imgs[vid].classList.add("show");              // l'image fixe reste dessous pendant le chargement
      panels.forEach((p, k) => {
        let o = 0;
        if (sg.type === "stop" && sg.i === k) o = k === 0 ? Math.min(1, (1 - local) / .25) : Math.min(1, local / .2, (1 - local) / .2);
        p.style.opacity = o; p.classList.toggle("visible", o > .5);
      });
      const cur = sg.type === "stop" ? sg.i : (local < .5 ? sg.i : sg.i + 1);
      document.querySelectorAll("#dots button").forEach((b, k) => b.setAttribute("aria-current", k === cur ? "true" : "false"));
    }
    requestAnimationFrame(frame);
  }
  buildMedia(); applyText(); requestAnimationFrame(frame);
})();
</script>
